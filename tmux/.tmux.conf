# change prefix keybind
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# mouse support
set -g mouse on

# vim style pane movement
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# removing delay when transitiong to normal mode in vim
set -sg escape-time 5

# move status bar to top
set-option -g status-position top

# pane splitting rebinds
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

### Status Bar - Custom Modern Theme
# Status bar positioning and general settings
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left-length 100
set -g status-right-length 100

# Left side: Session name with icon
set -g status-left '#[fg=#1e1e2e,bg=#89b4fa,bold] ❐ #S #[fg=#89b4fa,bg=#313244] '

# Right side: Git branch, directory, time, and date
set -g status-right '#[fg=#f38ba8,bg=#313244] %H:%M #[fg=#1e1e2e,bg=#f38ba8] %d %b '

# Window status formats
set-window-option -g window-status-format '#[fg=#6c7086,bg=#313244] #I:#W '
set-window-option -g window-status-current-format '#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W '
set-window-option -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'
